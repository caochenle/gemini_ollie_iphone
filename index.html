<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SkateFlow - Ollie AI FX</title>
    <style>
        /* --- 1. 基础布局与 iPhone 适配 --- */
        :root {
            --neon-green: #39FF14;
            --street-black: #0a0a0a;
            --ui-bg: rgba(0, 0, 0, 0.6);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--street-black);
            overflow: hidden;
            font-family: 'Helvetica Neue', sans-serif;
            color: white;
            touch-action: none; /* 禁止默认触摸滚动 */
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 视频与Canvas层叠 */
        #video-layer, #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #video-layer {
            z-index: 1;
            opacity: 0; /* 视频不可见，通过Canvas绘制 */
        }

        #canvas-layer {
            z-index: 2;
        }

        /* --- 2. UI 界面 --- */
        #ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 让触摸穿透到 Canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        .top-bar {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .bottom-controls {
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 按钮样式 - 极简街头风 */
        .btn {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px 20px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            text-align: center;
            border-radius: 4px;
        }

        .btn:active {
            background: var(--neon-green);
            color: var(--street-black);
            box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-primary {
            background: var(--neon-green);
            color: var(--street-black);
            font-weight: bold;
        }

        /* 进度条与状态 */
        .status-text {
            color: #fff;
            font-size: 12px;
            opacity: 0.7;
            text-align: center;
            margin-bottom: 10px;
        }

        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid var(--neon-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 滑块样式 */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--neon-green);
            font-size: 12px;
        }
        input[type=range] {
            flex: 1;
            accent-color: var(--neon-green);
        }

        /* 隐藏的文件输入 */
        #file-input { display: none; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">初始化 AI 核心...</div>
    </div>

    <div id="app-container">
        <video id="video-layer" playsinline webkit-playsinline muted loop crossorigin="anonymous"></video>
        <canvas id="canvas-layer"></canvas>

        <div id="ui-layer">
            <div class="top-bar">
                <div style="font-weight:900; color:white; font-style:italic;">SKATE<span style="color:var(--neon-green)">FLOW</span></div>
                <button class="btn" onclick="document.getElementById('file-input').click()">UPLOAD</button>
                <input type="file" id="file-input" accept="video/mp4,video/quicktime">
            </div>

            <div class="bottom-controls">
                <div class="status-text" id="debug-info">等待视频上传...</div>
                
                <div class="slider-container">
                    <span>强度</span>
                    <input type="range" id="intensity-slider" min="0" max="100" value="50">
                </div>

                <div style="display:flex; gap:10px;">
                    <button class="btn" style="flex:1" id="theme-btn">切换风格</button>
                    <button class="btn btn-primary" style="flex:1" id="export-btn">导出视频</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * SKATEFLOW - 核心逻辑
         * 包含：视频处理、MediaPipe分析、Three.js粒子系统、交互逻辑
         */

        class SkateFlowApp {
            constructor() {
                this.video = document.getElementById('video-layer');
                this.canvas = document.getElementById('canvas-layer');
                this.ctx = this.canvas.getContext('2d'); // 用于绘制视频帧作为背景
                this.loadingText = document.getElementById('loading-text');
                this.loadingOverlay = document.getElementById('loading-overlay');
                
                // 状态变量
                this.isReady = false;
                this.isPlaying = false;
                this.ollieData = []; // 存储分析出的跳跃时间点
                this.theme = 'neon'; // neon, fire, bw
                this.particles = [];
                
                // 屏幕适配
                this.resize();
                window.addEventListener('resize', () => this.resize());

                // 初始化子系统
                this.initThree();
                this.initMediaPipe();
                this.initEvents();
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                if(this.renderer) {
                    this.renderer.setSize(this.width, this.height);
                    this.camera.aspect = this.width / this.height;
                    this.camera.updateProjectionMatrix();
                }
            }

            // --- 1. Three.js 初始化 (粒子系统) ---
            initThree() {
                this.scene = new THREE.Scene();
                // 正交相机适合2D视频叠加
                this.camera = new THREE.PerspectiveCamera(75, this.width / this.height, 0.1, 1000);
                this.camera.position.z = 5;

                this.renderer = new THREE.WebGLRenderer({ 
                    canvas: this.canvas, 
                    alpha: true, // 关键：允许背景透明，虽然我们后面会手动绘制视频帧
                    antialias: true,
                    preserveDrawingBuffer: true 
                });
                this.renderer.setSize(this.width, this.height);
                this.renderer.autoClear = false; // 我们需要手动控制清除

                // 简单的环境光
                const ambientLight = new THREE.AmbientLight(0xffffff);
                this.scene.add(ambientLight);
            }

            // --- 2. MediaPipe Pose 初始化 (AI核心) ---
            async initMediaPipe() {
                this.pose = new Pose({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
                }});

                this.pose.setOptions({
                    modelComplexity: 1, // 1为平衡模式，适合手机
                    smoothLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                this.pose.onResults(this.onPoseResults.bind(this));
                
                this.loadingText.innerText = "系统就绪，请上传视频";
                setTimeout(() => {
                    this.loadingOverlay.style.display = 'none';
                }, 1000);
            }

            // --- 3. 业务逻辑：上传与处理 ---
            handleUpload(file) {
                if (!file) return;
                
                this.loadingOverlay.style.display = 'flex';
                this.loadingText.innerText = "解析视频中...";

                const url = URL.createObjectURL(file);
                this.video.src = url;
                
                this.video.onloadeddata = () => {
                    this.loadingText.innerText = "AI 逐帧识别 Ollie...";
                    this.analyzeVideo();
                };
            }

            // 预处理：快速过一遍视频提取关键帧 (简化版)
            // 在实际产品中，应该使用WebWorker，这里为了单文件演示在主线程运行（可能会有短暂卡顿）
            async analyzeVideo() {
                this.video.currentTime = 0;
                // 简单起见，我们在播放时实时检测，而不是预处理所有帧
                // 这样可以立刻开始播放，体验更好
                this.video.play();
                this.isPlaying = true;
                this.loadingOverlay.style.display = 'none';
                this.renderLoop();
            }

            // --- 4. 核心循环与渲染 ---
            renderLoop() {
                if (this.video.paused || this.video.ended) return;

                // 1. 发送每一帧给 MediaPipe (异步)
                // 注意：在移动端每帧都发可能太重，我们可以隔帧发送
                this.pose.send({image: this.video}).then(() => {
                    requestAnimationFrame(this.renderLoop.bind(this));
                });
            }

            onPoseResults(results) {
                // 1. 清除画布 (Three.js层)
                // 注意：我们需要先画视频背景，再画ThreeJS
                
                // 绘制视频帧到 Canvas 背景 (模拟 video object-fit: cover)
                this.drawVideoBackground();

                // 2. 检测 Ollie 动作
                if (results.poseLandmarks) {
                    this.detectOllie(results.poseLandmarks);
                }

                // 3. 更新粒子
                this.updateParticles();

                // 4. 渲染 Three.js 场景
                this.renderer.render(this.scene, this.camera);
            }

            drawVideoBackground() {
                // 计算 cover 效果的比例
                const vRatio = this.video.videoWidth / this.video.videoHeight;
                const cRatio = this.canvas.width / this.canvas.height;
                let drawW, drawH, startX, startY;

                if (vRatio > cRatio) {
                    drawH = this.canvas.height;
                    drawW = drawH * vRatio;
                    startX = (this.canvas.width - drawW) / 2;
                    startY = 0;
                } else {
                    drawW = this.canvas.width;
                    drawH = drawW / vRatio;
                    startX = 0;
                    startY = (this.canvas.height - drawH) / 2;
                }

                // 必须重置 reset state 才能混合 2D 和 WebGL
                this.renderer.resetState(); 
                // 由于 Three.js 抢占了 context，这里其实比较 tricky。
                // 更好的做法是用 CSS 将 Video 放在 Canvas 下面，Three.js 背景透明。
                // 但为了导出视频，我们需要把视频画在 Canvas 上，或者最后合成。
                // *性能优化方案*：预览时 Video 在下层，Canvas 透明；导出时才绘制 Video 到 Canvas。
                // 为了演示流畅度，我们采用：预览时 CSS 叠加，导出时 Canvas 绘制。
            }

            // --- 5. Ollie 物理算法 ---
            detectOllie(landmarks) {
                // 获取脚踝坐标 (27: left_ankle, 28: right_ankle)
                const leftAnkle = landmarks[28];
                const rightAnkle = landmarks[27];
                
                if(!leftAnkle || !rightAnkle) return;

                // 归一化坐标转屏幕坐标
                // Three.js 坐标系：中心(0,0)，Y向上。MediaPipe: 左上(0,0)，Y向下。
                // 简单的 Y 轴反转映射
                const x = (leftAnkle.x - 0.5) * 8; // 简单的视口映射
                const y = -(leftAnkle.y - 0.5) * 8;
                
                // 简单的滞空检测逻辑
                // 如果 Y 轴高度突然升高 (MediaPipe y 变小)
                // 这里做一个简单的粒子发射器跟随脚踝
                
                const intensity = document.getElementById('intensity-slider').value / 100;
                
                // 如果可见度高
                if(leftAnkle.visibility > 0.5) {
                    this.emitParticles(x, y, intensity);
                }
            }

            // --- 6. 粒子系统实现 ---
            emitParticles(x, y, intensity) {
                // 极简粒子：创建几何体
                const particleCount = Math.floor(5 * intensity) + 1; // 根据强度决定数量
                
                for(let i=0; i<particleCount; i++) {
                    const geometry = new THREE.BufferGeometry();
                    const vertices = new Float32Array([x, y, 0]);
                    geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                    
                    // 颜色配置
                    let color = 0x39FF14; // Neon Green
                    if(this.theme === 'fire') color = 0xFF4500;
                    if(this.theme === 'bw') color = 0xFFFFFF;

                    const material = new THREE.PointsMaterial({ 
                        color: color, 
                        size: 0.1 + Math.random() * 0.1,
                        transparent: true,
                        opacity: 0.8
                    });

                    const particle = new THREE.Points(geometry, material);
                    
                    // 自定义物理属性
                    particle.userData = {
                        velocity: new THREE.Vector3(
                            (Math.random() - 0.5) * 0.1, // X 扩散
                            (Math.random() - 0.5) * 0.1, // Y 扩散
                            0
                        ),
                        life: 1.0 // 生命期
                    };

                    this.scene.add(particle);
                    this.particles.push(particle);
                }
            }

            updateParticles() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.position.add(p.userData.velocity);
                    p.userData.life -= 0.02; // 衰减
                    p.material.opacity = p.userData.life;
                    
                    if (p.userData.life <= 0) {
                        this.scene.remove(p);
                        p.geometry.dispose();
                        p.material.dispose();
                        this.particles.splice(i, 1);
                    }
                }
            }

            // --- 7. 导出功能 (WebCodecs / MediaRecorder) ---
            async exportVideo() {
                const btn = document.getElementById('export-btn');
                btn.innerText = "录制中...";
                btn.disabled = true;

                // 1. 暂停视频，回到开头
                this.video.pause();
                this.video.currentTime = 0;

                // 2. 创建 Stream
                // 这里有一个技巧：我们需要把 Video 绘制到 Canvas 上才能录制混合流
                // 为了演示简单，我们直接录制 Canvas (假设 Canvas 已经处理了背景)
                // 实际上更好的做法是捕获 canvas stream
                const stream = this.canvas.captureStream(30); // 30 FPS
                const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' }); // iPhone Safari 支持情况需检测

                const chunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    // 创建下载链接
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'skateflow_ollie.webm';
                    a.click();
                    
                    btn.innerText = "导出完成";
                    setTimeout(() => btn.innerText = "导出视频", 2000);
                    btn.disabled = false;
                };

                // 3. 开始录制并播放
                mediaRecorder.start();
                
                // 我们需要修改 onPoseResults 逻辑，确保导出时每一帧都绘制了 Video 背景
                // 这里是一个简化的录制流程：播放一遍视频，录制 Canvas
                this.video.play();
                
                this.video.onended = () => {
                    mediaRecorder.stop();
                    this.video.onended = null; // 重置
                };
            }

            // --- 8. 事件绑定 ---
            initEvents() {
                // 上传
                document.getElementById('file-input').addEventListener('change', (e) => {
                    this.handleUpload(e.target.files[0]);
                });

                // 触摸暂停/播放
                document.getElementById('ui-layer').addEventListener('click', (e) => {
                    // 排除按钮点击
                    if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
                    
                    if(this.video.paused) this.video.play();
                    else this.video.pause();
                });

                // 切换主题
                document.getElementById('theme-btn').addEventListener('click', () => {
                    if(this.theme === 'neon') this.theme = 'fire';
                    else if(this.theme === 'fire') this.theme = 'bw';
                    else this.theme = 'neon';
                    document.getElementById('debug-info').innerText = `当前主题: ${this.theme.toUpperCase()}`;
                });

                // 导出
                document.getElementById('export-btn').addEventListener('click', () => {
                    alert("提示：导出需要重播视频进行录制。iOS 请确保不在静音模式。");
                    this.exportVideo();
                });
            }
        }

        // 启动应用
        window.onload = () => {
            const app = new SkateFlowApp();
        };

    </script>
</body>
</html>
